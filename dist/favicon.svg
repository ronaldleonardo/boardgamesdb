<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#3d2b8d"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- Dice body -->
  <polygon points="50,18 76,40 68,72 32,72 24,40" fill="#f0a500" stroke="#d99400" stroke-width="2"/>
  <!-- Dice face dots -->
  <circle cx="50" cy="40" r="3" fill="#2d1b69"/>
  <circle cx="38" cy="50" r="2.5" fill="#2d1b69"/>
  <circle cx="62" cy="50" r="2.5" fill="#2d1b69"/>
  <circle cx="44" cy="62" r="2.5" fill="#2d1b69"/>
  <circle cx="56" cy="62" r="2.5" fill="#2d1b69"/>
  <!-- Checkmark inside -->
  <polyline points="43,50 50,58 60,44" fill="none" stroke="#2d1b69" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>